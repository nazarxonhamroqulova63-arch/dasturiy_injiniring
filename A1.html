<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUDU — Team A1 Productivity Planner</title>
  <link rel="stylesheet" href="A1.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="glow-orb orb-morning"></div>
  <div class="glow-orb orb-night"></div>

  <div class="app-wrapper">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title-row">
            <h1 class="brand-name">DUDU</h1>
            <span class="badge team-badge" data-i18n="teamBadge">TEAM A1</span>
          </div>
          <p class="brand-subtitle" data-i18n="subtitle">Morning & Night Structured Productivity</p>
        </div>
      </div>

      <!-- Header Controls: Stats & Language Switcher -->
      <div class="header-actions">
        <!-- Progress Counter -->
        <div class="progress-pill">
          <div class="progress-info">
            <span id="completed-count">0</span>/<span id="total-count">0</span>
            <span class="progress-label" data-i18n="completed">completed</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- Language Switcher Pill -->
        <div class="lang-switch-group" role="group" aria-label="Language Switcher">
          <button type="button" class="lang-btn active" id="lang-en" data-lang="en">
            <span class="flag-icon">🇬🇧</span> EN
          </button>
          <button type="button" class="lang-btn" id="lang-uz" data-lang="uz">
            <span class="flag-icon">🇺🇿</span> UZ
          </button>
        </div>
      </div>
    </header>

    <!-- Global Quick-Add Bar -->
    <section class="task-creator-section">
      <form id="global-task-form" class="task-form">
        <div class="input-field-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <input 
            type="text" 
            id="task-input" 
            class="task-input" 
            placeholder="What needs to be done?..." 
            data-i18n-placeholder="addTaskPlaceholder"
            required 
            autocomplete="off"
          />
        </div>

        <div class="form-selectors">
          <!-- Section Selector (Morning / Night) -->
          <div class="select-wrapper">
            <select id="section-select" class="custom-select" aria-label="Select Section">
              <option value="morning" data-i18n="morning">Morning</option>
              <option value="night" data-i18n="night">Night</option>
            </select>
          </div>

          <!-- Category Selector (Mandatory / Optional) -->
          <div class="select-wrapper">
            <select id="category-select" class="custom-select" aria-label="Select Category">
              <option value="mandatory" data-i18n="mandatory">Mandatory</option>
              <option value="optional" data-i18n="optional">Optional</option>
            </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="add-task-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span data-i18n="addTaskBtn">Add Task</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Main Kanban / Board Grid -->
    <main class="board-container">
      
      <!-- ================= MORNING SECTION ================= -->
      <section class="time-block time-block-morning" id="morning-block">
        <div class="time-block-header">
          <div class="time-title-wrap">
            <div class="time-icon-badge morning-icon">
              <!-- Sunrise SVG -->
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v6M4.93 10.93l4.24-4.24M2 18h20M20 18a8 8 0 0 0-16 0M19.07 10.93l-4.24-4.24"/>
              </svg>
            </div>
            <div>
              <div class="time-heading-row">
                <h2 class="time-heading" data-i18n="morning">Morning</h2>
                <span class="section-count-chip" id="morning-total-chip">0</span>
              </div>
              <p class="time-subheading" data-i18n="morningDesc">Kickstart your day with focus and high priority habits</p>
            </div>
          </div>
        </div>

        <div class="sub-columns-grid">
          <!-- Morning: Mandatory -->
          <div class="task-column column-mandatory" data-section="morning" data-category="mandatory">
            <div class="column-header">
              <div class="col-title-group">
                <span class="status-indicator dot-mandatory"></span>
                <h3 class="col-title" data-i18n="mandatory">Mandatory</h3>
                <span class="item-count-badge" id="count-morning-mandatory">0</span>
              </div>
              <button type="button" class="quick-add-link" data-section="morning" data-category="mandatory" title="Quick Add">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
            </div>
            <div class="task-list dropzone" id="list-morning-mandatory">
              <!-- Task cards rendered here dynamically -->
            </div>
          </div>

          <!-- Morning: Optional -->
          <div class="task-column column-optional" data-section="morning" data-category="optional">
            <div class="column-header">
              <div class="col-title-group">
                <span class="status-indicator dot-optional"></span>
                <h3 class="col-title" data-i18n="optional">Optional</h3>
                <span class="item-count-badge" id="count-morning-optional">0</span>
              </div>
              <button type="button" class="quick-add-link" data-section="morning" data-category="optional" title="Quick Add">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
            </div>
            <div class="task-list dropzone" id="list-morning-optional">
              <!-- Task cards rendered here dynamically -->
            </div>
          </div>
        </div>
      </section>

      <!-- ================= NIGHT SECTION ================= -->
      <section class="time-block time-block-night" id="night-block">
        <div class="time-block-header">
          <div class="time-title-wrap">
            <div class="time-icon-badge night-icon">
              <!-- Moon SVG -->
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </div>
            <div>
              <div class="time-heading-row">
                <h2 class="time-heading" data-i18n="night">Night</h2>
                <span class="section-count-chip" id="night-total-chip">0</span>
              </div>
              <p class="time-subheading" data-i18n="nightDesc">Wrap up the day, reflect, and prepare for tomorrow</p>
            </div>
          </div>
        </div>

        <div class="sub-columns-grid">
          <!-- Night: Mandatory -->
          <div class="task-column column-mandatory" data-section="night" data-category="mandatory">
            <div class="column-header">
              <div class="col-title-group">
                <span class="status-indicator dot-mandatory"></span>
                <h3 class="col-title" data-i18n="mandatory">Mandatory</h3>
                <span class="item-count-badge" id="count-night-mandatory">0</span>
              </div>
              <button type="button" class="quick-add-link" data-section="night" data-category="mandatory" title="Quick Add">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
            </div>
            <div class="task-list dropzone" id="list-night-mandatory">
              <!-- Task cards rendered here dynamically -->
            </div>
          </div>

          <!-- Night: Optional -->
          <div class="task-column column-optional" data-section="night" data-category="optional">
            <div class="column-header">
              <div class="col-title-group">
                <span class="status-indicator dot-optional"></span>
                <h3 class="col-title" data-i18n="optional">Optional</h3>
                <span class="item-count-badge" id="count-night-optional">0</span>
              </div>
              <button type="button" class="quick-add-link" data-section="night" data-category="optional" title="Quick Add">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
            </div>
            <div class="task-list dropzone" id="list-night-optional">
              <!-- Task cards rendered here dynamically -->
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Footer with Tips and Team Credit -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="team-signature">Designed & Crafted for <strong>Team A1</strong></span>
      </div>
      <div class="footer-actions">
        <button type="button" class="btn btn-ghost" id="clear-completed-btn" data-i18n="clearCompleted">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span data-i18n="clearCompletedText">Clear Completed</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="A1.js"></script>
</body>
</html>
